<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hearts and Flowers Task v7</title>

  <!--
    Fixed version:
    1) Loads jsPsych from CDN, so missing local lib/ files will not cause a blank page.
    2) experiment.js automatically skips Pavlovia init/finish when opened locally.
    3) When uploaded to run.pavlovia.org, it uses the Pavlovia plugin if loaded.

    If your computer/lab network blocks unpkg.com, run this through Pavlovia or download
    the jsPsych release files into local folders and replace these CDN links with local paths.
  -->
  <link rel="stylesheet" href="https://unpkg.com/jspsych@7.1.2/css/jspsych.css" />
  <script src="https://unpkg.com/jspsych@7.1.2/dist/index.browser.min.js"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.0/dist/index.browser.min.js"></script>
  <script src="https://unpkg.com/@jspsych/plugin-preload@1.1.0/dist/index.browser.min.js"></script>
  <script src="https://unpkg.com/@jspsych/plugin-fullscreen@1.1.0/dist/index.browser.min.js"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@1.0.0/dist/index.browser.min.js"></script>

  <!-- Pavlovia plugin. It is used only online; local preview skips it automatically. -->
  <script src="https://lib.pavlovia.org/jspsych-7-pavlovia-2022.1.1.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #f7f7f7;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }
    .jspsych-content-wrapper { height: 100%; }
    .instr-wrap {
      min-height: 92vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
      box-sizing: border-box;
    }
    .instr-img {
      max-width: 94vw;
      max-height: 84vh;
      object-fit: contain;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      background: white;
    }
    .continue-hint {
      font-size: 18px;
      color: #333;
      letter-spacing: 0.2px;
    }
    .hf-screen {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f7f7;
    }
    .hf-frame {
      width: min(74vw, 920px);
      height: min(38vh, 290px);
      position: relative;
      border: 2px solid #444;
      background: #fff;
      box-sizing: border-box;
    }
    .fixation {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 28px;
      line-height: 1;
    }
    .hf-stim {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      max-width: min(12vw, 90px);
      max-height: min(12vw, 90px);
      object-fit: contain;
    }
    .hf-stim.left { left: 25%; }
    .hf-stim.right { left: 75%; }

    .fallback-box {
      max-width: 850px;
      background: #fff;
      border: 1px solid #ccc;
      padding: 36px 44px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      text-align: center;
    }
    .fallback-box h1 { margin: 0 0 18px; }
    .fallback-box p { font-size: 20px; line-height: 1.55; }
    .debug-note {
      max-width: 860px;
      margin: 36px auto;
      padding: 24px 28px;
      background: #fff3cd;
      border: 1px solid #ffe08a;
      border-radius: 12px;
      font-size: 17px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <script src="experiment.js"></script>
</body>
</html>
